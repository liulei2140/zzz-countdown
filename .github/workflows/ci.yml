name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npx astro check

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check .

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://zzzcountdown.space' }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
        run: npm run build

      - name: Verify the built countdown
        run: npm run verify

      - name: Report the deployment status
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare credentials present: the deploy job runs after this check." >> $GITHUB_STEP_SUMMARY
          else
            echo "CLOUDFLARE_API_TOKEN is not set, so the deploy job was skipped." >> $GITHUB_STEP_SUMMARY
            echo "Create a token with 'Cloudflare Pages: Edit' and 'Workers Scripts: Edit' for this account, then add it as the repository secret CLOUDFLARE_API_TOKEN." >> $GITHUB_STEP_SUMMARY
          fi

  deploy:
    name: Deploy to Cloudflare Pages
    needs: check
    runs-on: ubuntu-latest
    # The `secrets` context is not available in a job-level `if`, so the
    # credentials are exposed as job-level environment variables and the
    # deploy step checks them there.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://zzzcountdown.space' }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zzz-countdown --branch=main

      - name: Report that the deploy was skipped
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "Cloudflare credentials are not configured, so nothing was deployed." >> $GITHUB_STEP_SUMMARY
          echo "See the Deployment section of README.md for the two secrets and the commands to add them." >> $GITHUB_STEP_SUMMARY
