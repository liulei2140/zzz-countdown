name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npx astro check

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check .

      - name: Build
        env:
          SITE_URL: https://zzz-countdown.pages.dev
        run: npm run build

      - name: Verify the built countdown
        run: npm run verify

      - name: Report the deployment status
        if: always()
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Cloudflare credentials present: the deploy job runs after this check." >> $GITHUB_STEP_SUMMARY
          else
            echo "CLOUDFLARE_API_TOKEN is not set, so the deploy job was skipped." >> $GITHUB_STEP_SUMMARY
            echo "Create a token with 'Cloudflare Pages: Edit' and 'Workers Scripts: Edit' for this account, then add it as the repository secret CLOUDFLARE_API_TOKEN." >> $GITHUB_STEP_SUMMARY
          fi

  deploy:
    name: Deploy to Cloudflare Pages
    needs: check
    # Skipped until the repository has the Cloudflare credentials. The account
    # ID is public; the API token has to be created in the Cloudflare dashboard.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SITE_URL: https://zzz-countdown.pages.dev
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zzz-countdown --branch=main
