<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ZZZ 3.3 countdown">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2040"/>
      <stop offset="60%" stop-color="#0b0d1c"/>
      <stop offset="100%" stop-color="#06060c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="45%" stop-color="#ff8a2b"/>
      <stop offset="100%" stop-color="#ff3b5c"/>
    </linearGradient>
    <linearGradient id="z" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd6f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#ff7a2f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>

  <!-- countdown track -->
  <circle cx="32" cy="29.5" r="23" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="5"/>
  <!-- countdown arc: the cycle still to run -->
  <circle
    cx="32"
    cy="29.5"
    r="23"
    fill="none"
    stroke="url(#ring)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-dasharray="102 43"
    transform="rotate(-90 32 29.5)"
  />

  <!-- the Z, cut the way the ZZZ mark is cut -->
  <g transform="translate(32 29.5) skewX(-8) translate(-32 -29.5)">
    <path d="M19 15 H45 V22.5 L27 37 H45 V45 H19 V37.5 L37 23 H19 Z" fill="url(#z)"/>
    <path d="M35.5 23.5 L41 23.5 L27.5 40.5 L22 40.5 Z" fill="#0b0d1c"/>
  </g>

  <!-- the orange strip from the 3.3 key art -->
  <rect x="16" y="57.5" width="32" height="2.5" rx="1.25" fill="url(#ring)"/>
</svg>
